<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Class Chatroom</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
    {% raw %}
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #000000;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    header {
        text-align: center;
        margin-bottom: 20px;
        width: 100%;
    }

    .card {
        background: #0a0a0a;
        border: 1px solid #222222;
        padding: 25px;
        border-radius: 12px;
        width: 90%;
        max-width: 900px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
        box-sizing: border-box;
    }

    h2 { text-align: center; color: #00e676; margin-top: 0; }

    input, button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 6px;
        border: none;
        box-sizing: border-box;
    }

    input {
        background: #000000;
        color: #ffffff;
        border: 1px solid #333333;
        font-size: 15px;
    }

    input:focus {
        outline: 1px solid #00e676;
        border-color: #00e676;
    }

    button {
        background: #00e676;
        color: black;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover { background: #00c853; }

    #chat-box {
        height: 450px;
        overflow-y: auto;
        background: #000000;
        border: 1px solid #222222;
        border-radius: 6px;
        padding: 15px;
        margin-bottom: 10px;
    }

    .message { margin-bottom: 8px; font-size: 15px; word-wrap: break-word; color: #ffffff; }
    .system { color: #888888; font-style: italic; text-align: center; }
    .hidden { display: none; }
    {% endraw %}
    </style>
</head>
<body>

    <header>
        <h1 style="margin-bottom: 5px;">CS Class Chatroom</h1>
        <h2 style="margin-top: 0; color: #00e676;">Designed by Jackson America Inc.</h2>
        <p style="margin: 2px 0; font-size: 1.1em; color: #ccc;">
            Stanford, Silicon Valley, California, The United States of America
        </p>
        <p style="margin-top: 8px; font-style: italic; color: #aaa;">
            (Programmer is only 17 years old)
        </p>
    </header>

    <!-- Live Active User Counter -->
    <div style="text-align: center; margin-bottom: 10px; color: #00e676;">
        🟢 Active Users: <span id="online-count">0</span>
    </div>

    <!-- Login Card (Username Input Screen) -->
    <div id="login-card" class="card">
        <h2>CS Class Chatroom</h2>
        <p style="text-align:center; font-size:13px; color:#aaa;">Enter your name to start chatting</p>
        <input type="text" id="username-input" placeholder="Type your name (e.g. David, Richard)..." onkeypress="handleLoginKeyPress(event)" autocomplete="off">
        <button onclick="login()">Join Chat</button>
    </div>

    <!-- Chat Card Screen -->
    <div id="chat-card" class="card hidden">
        <h2>CS Group Chat</h2>
        <div id="chat-box"></div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" style="color: #aaa; font-size: 13px; height: 18px; margin-bottom: 5px; font-style: italic;"></div>

        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)" autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const socket = io();
        let currentUser = "";
        let audioCtx = null;
        let typingTimer;

        // Sound Notification Generator
        function playBeepSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio notification error:", e);
            }
        }

        // KeyPress Handler for Login Box
        function handleLoginKeyPress(e) {
            if (e.key === 'Enter') {
                login();
            }
        }

        // Login Function: Immediately transitions UI and emits to Python server
        function login() {
            const name = document.getElementById('username-input').value.trim();
            if (name !== "") {
                currentUser = name;
                playBeepSound();

                if ("Notification" in window && Notification.permission !== "granted") {
                    Notification.requestPermission();
                }

                // Instantly switch cards visually
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('chat-card').classList.remove('hidden');

                // Emit event to Python backend
                socket.emit('join_room', { username: name });
            }
        }

        // Send Message Logic
        function sendMessage() {
            const msgInput = document.getElementById('message-input');
            const msg = msgInput.value.trim();
            if (msg) {
                socket.emit('send_message', { user: currentUser, msg: msg });
                msgInput.value = '';
                document.getElementById('typing-indicator').innerText = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Typing Indicator Listener
        document.getElementById('message-input').addEventListener('input', function() {
            if (currentUser) {
                socket.emit('typing', { user: currentUser });
            }
        });

        socket.on('display_typing', function(data) {
            const indicator = document.getElementById('typing-indicator');
            indicator.innerText = `${data.user} is typing...`;

            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                indicator.innerText = '';
            }, 2000);
        });

        // Receive Message Listener
        socket.on('receive_message', function(data) {
            document.getElementById('typing-indicator').innerText = '';

            if (data.user !== currentUser && data.user !== 'System') {
                playBeepSound();
            }

            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');

            if (data.user === 'System') {
                msgDiv.classList.add('system');
                msgDiv.innerText = data.msg;
            } else {
                msgDiv.innerHTML = `<b style="color:#00e676">${data.user}:</b> ${data.msg}`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // Online User Count Listener
        socket.on('update_user_count', function(data) {
            document.getElementById('online-count').innerText = data.count;
        });
    </script>
</body>
</html>
